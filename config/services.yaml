parameters:
  app.evidence_storage_dir: '%env(resolve:EVIDENCE_STORAGE_DIR)%'
  app.playwright_worker_url: '%env(PLAYWRIGHT_WORKER_URL)%'
  app.retest_default_timeout_ms: '%env(int:RETEST_DEFAULT_TIMEOUT_MS)%'
  # Keep expected IDs in sync with the supervised daemons. For a smaller
  # deployment remove the matching entries as well as the DDEV workers.
  app.health_workers:
    recheck:
      recheck-1: '%env(PLAYWRIGHT_WORKER_URL)%'
      recheck-2: '%env(PLAYWRIGHT_WORKER_URL)%'
      recheck-3: '%env(PLAYWRIGHT_WORKER_URL)%'
      recheck-4: '%env(PLAYWRIGHT_WORKER_URL)%'
    screenshot:
      shot-1: 'http://playwright-shot-1:3000'
      shot-2: 'http://playwright-shot-2:3000'
      shot-3: 'http://playwright-shot-3:3000'
      shot-4: 'http://playwright-shot-4:3000'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\Service\BrowserRetestClientInterface: '@App\Service\PlaywrightBrowserRetestClient'
  App\Service\BrowserRetestTransportInterface: '@App\Service\PlaywrightBrowserRetestClient'
  App\Service\BrowserScreenshotClientInterface: '@App\Service\PlaywrightBrowserScreenshotClient'
  App\Service\EvidenceStorageInterface: '@App\Service\LocalEvidenceStorage'
  App\Service\ScreenshotEnqueuerInterface: '@App\Service\ScreenshotQueueService'

  App\Service\WorkerHealthRegistry:
    arguments:
      $workers: '%app.health_workers%'

  App\Service\LocalEvidenceStorage:
    arguments:
      $evidenceDir: '%app.evidence_storage_dir%'

  App\Service\PlaywrightBrowserRetestClient:
    arguments:
      $workerUrl: '%app.playwright_worker_url%'

  App\Service\PlaywrightBrowserScreenshotClient:
    arguments:
      $workerUrl: '%app.playwright_worker_url%'
