services:
  # The health UI must never contact real sidecars during PHPUnit tests.
  test.health_http_client:
    class: Symfony\Component\HttpClient\MockHttpClient

  App\Service\BrowserHealthService:
    autowire: true
    arguments:
      $httpClient: '@test.health_http_client'

  # Contact lookups in tests cannot make DNS or network requests.
  test.security_txt_http_client:
    class: Symfony\Component\HttpClient\MockHttpClient

  App\Service\SecurityTxtProvider:
    autowire: true
    arguments:
      $client: '@test.security_txt_http_client'
