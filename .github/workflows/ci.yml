name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP tests
        run: vendor/bin/phpunit

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

  node:
    name: Node worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-worker/package-lock.json

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Node tests
        run: npm test

      - name: Audit Node dependencies
        run: npm audit --omit=dev --audit-level=high

  backup:
    name: Backup tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backup tests
        run: python -B -m unittest discover -s tests -p 'backup_local_test.py' -v
