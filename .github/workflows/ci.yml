name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP tests
        run: vendor/bin/phpunit

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

  node:
    name: Node worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-worker/package-lock.json

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Node tests
        run: npm test

      - name: Audit Node dependencies
        run: npm audit --omit=dev --audit-level=high

  backup:
    name: Backup tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backup tests
        run: python -B -m unittest discover -s tests -p 'backup_local_test.py' -v

  browser:
    name: Studio browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --prefix playwright-worker --no-audit --no-fund
      - run: ./playwright-worker/node_modules/.bin/playwright install --with-deps chromium
      - name: Test Settings, diagnostics and inventory views with isolated fixtures
        run: python tests/browser/run_preferences.py
      - name: Test Review focus and assessment transitions with isolated fixtures
        run: python tests/browser/run_review.py
      - name: Test Review deferral and resume with a fresh isolated fixture
        run: python tests/browser/run_review.py
        env:
          STUDIO_REVIEW_ONLY: recovery
      - name: Test intake sessions, help, compact statistics and release updates with fresh fixtures
        run: python tests/browser/run_intake.py
      - name: Test footer utilities and lazy accessible dialogs
        run: node tests/browser/studio-utilities-ui.cjs
        env:
          STUDIO_BROWSER_OUTPUT: var/utilities-ui-acceptance
      - name: Test embedded noVNC controls with synthetic RFB fixtures
        run: node tests/browser/studio-review-novnc-ui.cjs
        env:
          STUDIO_BROWSER_OUTPUT: var/novnc-ui-acceptance
      - name: Test composed PHP, lease and noVNC review flow
        run: node tests/browser/studio-review-novnc-e2e.cjs
        env:
          STUDIO_BROWSER_OUTPUT: var/novnc-e2e-acceptance
      - name: Keep browser screenshots and fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-smoke
          path: |
            var/preferences-acceptance-*/
            var/review-focus-acceptance-*/
            var/review-recovery-acceptance-*/
            var/intake-acceptance-*/
            var/utilities-ui-acceptance/
            var/novnc-ui-acceptance/
            var/novnc-e2e-acceptance/
          if-no-files-found: ignore
