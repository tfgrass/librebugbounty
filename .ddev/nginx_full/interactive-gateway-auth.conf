# DDEV copies nginx_full/*.conf into sites-enabled (http context).
# Docker network only: no host port or Traefik route for 8096.
server {
    listen 8096;
    server_name _;
    root /var/www/html/public;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 16k;
    client_body_timeout 2s;

    location = /internal/interactive-gateway/authorize {
        if ($request_method != POST) { return 405; }
        if ($is_args != "") { return 400; }
        # Front controller, SAME FPM pool/socket and PHP session storage as web.
        # Keep REQUEST_URI while giving standard FastCGI params /index.php.
        rewrite ^ /index.php break;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_connect_timeout 1s;
        fastcgi_read_timeout 2s;
        fastcgi_send_timeout 2s;
        fastcgi_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    location / { return 404; }
}
