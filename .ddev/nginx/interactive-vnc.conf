# Included inside DDEV's public server block. Callback/control remain private.
location = /internal/interactive-gateway {
    return 404;
}
location ^~ /internal/interactive-gateway/ {
    return 404;
}

location ~ ^/review/[^/]+/interactive/vnc$ {
    if ($request_method != GET) { return 405; }
    if ($http_upgrade !~* "^websocket$") { return 426; }
    if ($http_connection !~* "(^|,)\s*upgrade\s*(,|$)") { return 426; }
    # Channels ride in Sec-WebSocket-Protocol; queries never carry tokens.
    if ($is_args != "") { return 400; }

    # Resolve at request time so web can start before the sidecar is healthy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $interactive_gateway playwright-interactive:3000;
    proxy_pass http://$interactive_gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    gzip off;
    add_header Cache-Control "no-store" always;
    access_log off;
    error_log /dev/stderr crit;
}
