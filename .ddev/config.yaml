name: librebugbounty
type: php
docroot: public
php_version: "8.3"
webserver_type: nginx-fpm
use_dns_when_possible: true
composer_version: "2"
additional_hostnames: []
additional_fqdns: []
project_tz: Europe/Berlin
mkcert_caroot: ~/.local/share/mkcert
web_environment:
  - APP_ENV=dev
  - APP_DEBUG=1
  - APP_SECRET=local-ddev-only
  - DATABASE_URL=sqlite:////var/www/html/storage/database/app.sqlite
  - EVIDENCE_STORAGE_DIR=/var/www/html/storage/artifacts
  - PLAYWRIGHT_WORKER_URL=http://playwright:3000
  - RETEST_DEFAULT_TIMEOUT_MS=10000
hooks:
  post-start:
    - exec: "mkdir -p storage/database storage/artifacts storage/test/database storage/test/artifacts"
    - composer: install
    - exec: "php bin/console app:db:init"
    - exec: "supervisorctl restart webextradaemons:screenshot-worker-1 webextradaemons:screenshot-worker-2 webextradaemons:screenshot-worker-3 webextradaemons:screenshot-worker-4"
    - exec: "supervisorctl restart webextradaemons:recheck-worker-1 webextradaemons:recheck-worker-2 webextradaemons:recheck-worker-3 webextradaemons:recheck-worker-4"
web_extra_daemons:
  - name: screenshot-worker-1
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; PLAYWRIGHT_WORKER_URL=http://playwright-shot-1:3000 exec php bin/console app:screenshot:worker --sleep=2 --worker-id=shot-1 --no-interaction"
    directory: /var/www/html
  - name: screenshot-worker-2
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; PLAYWRIGHT_WORKER_URL=http://playwright-shot-2:3000 exec php bin/console app:screenshot:worker --sleep=2 --worker-id=shot-2 --no-interaction"
    directory: /var/www/html
  - name: screenshot-worker-3
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; PLAYWRIGHT_WORKER_URL=http://playwright-shot-3:3000 exec php bin/console app:screenshot:worker --sleep=2 --worker-id=shot-3 --no-interaction"
    directory: /var/www/html
  - name: screenshot-worker-4
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; PLAYWRIGHT_WORKER_URL=http://playwright-shot-4:3000 exec php bin/console app:screenshot:worker --sleep=2 --worker-id=shot-4 --no-interaction"
    directory: /var/www/html
  - name: recheck-worker-1
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; exec php bin/console app:recheck:worker --sleep=300 --worker-id=recheck-1 --no-interaction"
    directory: /var/www/html
  - name: recheck-worker-2
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; exec php bin/console app:recheck:worker --sleep=300 --worker-id=recheck-2 --no-interaction"
    directory: /var/www/html
  - name: recheck-worker-3
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; exec php bin/console app:recheck:worker --sleep=300 --worker-id=recheck-3 --no-interaction"
    directory: /var/www/html
  - name: recheck-worker-4
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; exec php bin/console app:recheck:worker --sleep=300 --worker-id=recheck-4 --no-interaction"
    directory: /var/www/html
