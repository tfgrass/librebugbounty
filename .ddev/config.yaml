name: librebugbounty
type: php
docroot: public
php_version: "8.3"
webserver_type: nginx-fpm
use_dns_when_possible: true
composer_version: "2"
additional_hostnames: []
additional_fqdns: []
project_tz: Europe/Berlin
mkcert_caroot: ~/.local/share/mkcert
web_environment:
  - APP_ENV=dev
  - APP_DEBUG=1
  - APP_SECRET=local-ddev-only
  - DATABASE_URL=sqlite:////var/www/html/storage/database/app.sqlite
  - EVIDENCE_STORAGE_DIR=/var/www/html/storage/artifacts
  - PLAYWRIGHT_WORKER_URL=http://playwright:3000
  - RETEST_DEFAULT_TIMEOUT_MS=10000
hooks:
  post-start:
    - exec: "mkdir -p storage/database storage/artifacts storage/test/database storage/test/artifacts"
    - composer: install
    - exec: "php bin/console app:db:init"
    - exec: "supervisorctl restart webextradaemons:screenshot-queue"
web_extra_daemons:
  - name: screenshot-queue
    command: "until [ -f vendor/autoload.php ]; do sleep 1; done; exec php bin/console app:screenshot:worker --sleep=2 --no-interaction"
    directory: /var/www/html
