# Worker HTTP ports stay internal (expose only, no host-published ports).
# PLAYWRIGHT_WORKER_TOKEN below is a development value shared with config.yaml;
# shot-2 through shot-4 inherit it from the shot-1 YAML anchor.
services:
  # Technical rechecks normally remain headless. This lane also owns Xvfb
  # for explicit one-shot recovery; the screenshot lanes below use separate
  # desktops, so parallel headed captures cannot overlap.
  playwright:
    image: mcr.microsoft.com/playwright:v1.61.1-jammy
    container_name: ddev-${DDEV_SITENAME}-playwright
    working_dir: /var/www/html/playwright-worker
    command: >
      ./start.sh
    volumes:
      - ../:/var/www/html
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PLAYWRIGHT_WORKER_MODE=retest
      - PLAYWRIGHT_WORKER_TOKEN=local-ddev-playwright-worker-token
    init: true
    healthcheck:
      test: ["CMD", "./start.sh", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  playwright-shot-1:
    &playwright_shot_service
    image: mcr.microsoft.com/playwright:v1.61.1-jammy
    container_name: ddev-${DDEV_SITENAME}-playwright-shot-1
    working_dir: /var/www/html/playwright-worker
    command: ./start.sh
    volumes:
      - ../:/var/www/html
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PLAYWRIGHT_WORKER_MODE=shot
      - PLAYWRIGHT_WORKER_TOKEN=local-ddev-playwright-worker-token
    init: true
    healthcheck:
      test: ["CMD", "./start.sh", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  playwright-shot-2:
    <<: *playwright_shot_service
    container_name: ddev-${DDEV_SITENAME}-playwright-shot-2

  playwright-shot-3:
    <<: *playwright_shot_service
    container_name: ddev-${DDEV_SITENAME}-playwright-shot-3

  playwright-shot-4:
    <<: *playwright_shot_service
    container_name: ddev-${DDEV_SITENAME}-playwright-shot-4

  # The only interactive desktop. Both VNC transports bind container loopback.
  playwright-interactive:
    build:
      context: .
      dockerfile: playwright-interactive.Dockerfile
    image: ddev-${DDEV_SITENAME}-playwright-interactive:1.61.1-vnc1
    container_name: ddev-${DDEV_SITENAME}-playwright-interactive
    working_dir: /var/www/html/playwright-worker
    command: ./start.sh
    init: true
    stop_grace_period: 10s
    shm_size: 1gb
    volumes:
      - ../:/var/www/html
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PLAYWRIGHT_WORKER_MODE=interactive
      - PLAYWRIGHT_WORKER_TOKEN=local-ddev-playwright-worker-token
      # Development only; distinct from worker/app secrets. Never deploy this literal.
      - PLAYWRIGHT_GATEWAY_TOKEN=local-ddev-interactive-gateway-token
      - PLAYWRIGHT_GATEWAY_AUTH_URL=http://web:8096/internal/interactive-gateway/authorize
      - PLAYWRIGHT_ALLOWED_ORIGINS=https://${DDEV_HOSTNAME},http://${DDEV_HOSTNAME}
    healthcheck:
      test: ["CMD", "./start.sh", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 15s
